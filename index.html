<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Shopping Mall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navbar (Hidden on Landing) -->
    <nav id="navbar" class="bg-white p-4 shadow flex justify-between items-center hidden">
        <div class="flex items-center space-x-3">
            <h1 class="text-xl font-bold text-gray-800">Grace Shopping Mall</h1>
            <span id="roleBadge" class="text-xs px-2 py-1 rounded font-semibold"></span>
        </div>
        <div class="flex items-center space-x-4">
            <span id="userEmailDisplay" class="text-sm text-gray-600 hidden sm:inline"></span>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded text-sm font-medium">Logout</button>
        </div>
    </nav>

    <!-- 1. LANDING VIEW -->
    <div id="landingView" class="min-h-screen flex flex-col justify-center items-center p-6 bg-gradient-to-br from-blue-50 to-indigo-100">
        <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full text-center">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Grace Shopping Mall</h1>
            <p class="text-gray-500 mb-8">Exclusive Dress Collection & Direct WhatsApp Ordering</p>
            
            <div class="space-y-4">
                <button onclick="handleLogin('user')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition flex items-center justify-center space-x-2">
                    <span>User Login</span>
                </button>
                <button onclick="handleLogin('admin')" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-4 rounded-lg shadow transition flex items-center justify-center space-x-2">
                    <span>Admin Login</span>
                </button>
            </div>
            <p id="authError" class="text-red-600 text-sm mt-4 hidden"></p>
        </div>
    </div>

    <!-- 2. ADMIN VIEW -->
    <div id="adminView" class="max-w-6xl mx-auto p-6 hidden">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Admin Inventory Management</h2>
                <p class="text-sm text-gray-500">Manage catalog items, pricing, and archive status.</p>
            </div>
            <div class="flex space-x-2">
                <button onclick="seedDefaultProducts()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-sm font-medium">Seed 12 Sample Dresses</button>
                <button onclick="switchToStorePreview()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm font-medium">Preview User Store</button>
            </div>
        </div>

        <!-- Add / Edit Product Form -->
        <div class="bg-white p-6 rounded-lg shadow mb-8 border border-gray-200">
            <h3 id="formTitle" class="text-lg font-bold text-gray-800 mb-4">Add New Dress</h3>
            <form id="productForm" onsubmit="saveProduct(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="hidden" id="editProductId">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Dress Name</label>
                    <input type="text" id="prodName" required placeholder="e.g., Silk Anarkali" class="w-full border rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Price (₹)</label>
                    <input type="number" id="prodPrice" required placeholder="1599" class="w-full border rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Image URL</label>
                    <input type="url" id="prodImage" required placeholder="https://..." class="w-full border rounded p-2 text-sm">
                </div>
                <div class="flex items-end space-x-2">
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded text-sm">Upload Product</button>
                    <button type="button" id="cancelEditBtn" onclick="resetForm()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-3 rounded text-sm hidden">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Admin Product Table -->
        <div class="bg-white rounded-lg shadow overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-600 uppercase">
                        <th class="p-3">Image</th>
                        <th class="p-3">Name</th>
                        <th class="p-3">Price</th>
                        <th class="p-3">Status</th>
                        <th class="p-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="adminProductList" class="divide-y text-sm"></tbody>
            </table>
        </div>
    </div>

    <!-- 3. USER STORE VIEW -->
    <div id="userView" class="max-w-6xl mx-auto p-6 hidden">
        <div id="adminReturnBanner" class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-800 p-3 mb-6 justify-between items-center hidden">
            <span class="text-sm font-medium">Admin Store Preview Mode</span>
            <button onclick="returnToAdmin()" class="bg-yellow-600 text-white px-3 py-1 rounded text-xs font-bold">Back to Admin Panel</button>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-6">Dress Catalog</h2>
        <div id="userProductGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAScm8g7PzcfL_YpEQ40sUK8V8bYu7i_DI",
            authDomain: "grace-shopping-mall-wgl.firebaseapp.com",
            projectId: "grace-shopping-mall-wgl",
            storageBucket: "grace-shopping-mall-wgl.firebasestorage.app",
            messagingSenderId: "873828074356",
            appId: "1:873828074356:web:e7ae50e7117b7cb90d2221",
            measurementId: "G-X3EVQ7RPB2"
        };
        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- STRICT ROLE CONFIGURATION ---
        const ADMIN_EMAILS = ["damerajona@gmail.com"];
        const WHATSAPP_NUMBER = "919492631963";
        let intendedRole = "user";
        let productsUnsubscribe = null;

        // --- DEFAULT 12 DRESS ITEMS ---
        const DEFAULT_DRESSES = [
            { name: "Banarasi Silk Saree", price: 2499, image: "https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=500&q=80", archived: false },
            { name: "Embroidered Anarkali Suit", price: 1850, image: "https://images.unsplash.com/photo-1583391733958-6c5e81f2e088?w=500&q=80", archived: false },
            { name: "Floral Georgette Maxi Dress", price: 1299, image: "https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=500&q=80", archived: false },
            { name: "Cotton Kurti Palazzo Set", price: 999, image: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=500&q=80", archived: false },
            { name: "Designer Bridal Lehenga", price: 4999, image: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=500&q=80", archived: false },
            { name: "Chanderi Festive Kurta", price: 1450, image: "https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?w=500&q=80", archived: false },
            { name: "Pastel Net Evening Gown", price: 2799, image: "https://images.unsplash.com/photo-1566174053879-31528523f8ae?w=500&q=80", archived: false },
            { name: "Kanjeevaram Tissue Saree", price: 3200, image: "https://images.unsplash.com/photo-1610030469668-8e9f641aaf27?w=500&q=80", archived: false },
            { name: "Indigo Block Print Dress", price: 1150, image: "https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=500&q=80", archived: false },
            { name: "Velvet Winter Shawl Suit", price: 2100, image: "https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=500&q=80", archived: false },
            { name: "Organza Ruffle Saree", price: 1950, image: "https://images.unsplash.com/photo-1609357605129-26f69add5d6e?w=500&q=80", archived: false },
            { name: "Chikankari Lucknowi Kurti", price: 1350, image: "https://images.unsplash.com/photo-1585487000160-6ebcfceb0d03?w=500&q=80", archived: false }
        ];

        // --- AUTHENTICATION & ACCESS CONTROL ---
        function handleLogin(role) {
            intendedRole = role;
            const errorEl = document.getElementById('authError');
            errorEl.classList.add('hidden');

            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => {
                errorEl.textContent = error.message;
                errorEl.classList.remove('hidden');
            });
        }

        function logout() {
            if (productsUnsubscribe) productsUnsubscribe();
            auth.signOut();
        }

        auth.onAuthStateChanged((user) => {
            const landingView = document.getElementById('landingView');
            const adminView = document.getElementById('adminView');
            const userView = document.getElementById('userView');
            const navbar = document.getElementById('navbar');
            const errorEl = document.getElementById('authError');
            const roleBadge = document.getElementById('roleBadge');
            const emailDisplay = document.getElementById('userEmailDisplay');

            if (!user) {
                landingView.classList.remove('hidden');
                navbar.classList.add('hidden');
                adminView.classList.add('hidden');
                userView.classList.add('hidden');
                return;
            }

            const isAdmin = ADMIN_EMAILS.includes(user.email.toLowerCase());

            if (intendedRole === 'admin' && !isAdmin) {
                auth.signOut();
                errorEl.textContent = "Access Denied: Your email is not authorized for Admin access.";
                errorEl.classList.remove('hidden');
                return;
            }

            landingView.classList.add('hidden');
            navbar.classList.remove('hidden');
            emailDisplay.textContent = user.email;

            if (isAdmin && intendedRole === 'admin') {
                roleBadge.textContent = "ADMIN";
                roleBadge.className = "text-xs px-2 py-1 rounded font-semibold bg-red-100 text-red-700";
                adminView.classList.remove('hidden');
                userView.classList.add('hidden');
                listenToProducts(true);
            } else {
                roleBadge.textContent = "CUSTOMER";
                roleBadge.className = "text-xs px-2 py-1 rounded font-semibold bg-blue-100 text-blue-700";
                adminView.classList.add('hidden');
                userView.classList.remove('hidden');
                document.getElementById('adminReturnBanner').classList.toggle('hidden', !isAdmin);
                listenToProducts(false);
            }
        });

        // --- VIEW SWITCHING FOR ADMIN ---
        function switchToStorePreview() {
            document.getElementById('adminView').classList.add('hidden');
            document.getElementById('userView').classList.remove('hidden');
            document.getElementById('adminReturnBanner').classList.remove('hidden');
            listenToProducts(false);
        }

        function returnToAdmin() {
            const user = auth.currentUser;
            if (user && ADMIN_EMAILS.includes(user.email.toLowerCase())) {
                document.getElementById('userView').classList.add('hidden');
                document.getElementById('adminView').classList.remove('hidden');
                listenToProducts(true);
            }
        }

        // --- FIRESTORE REALTIME LISTENER ---
        function listenToProducts(isAdminMode) {
            if (productsUnsubscribe) productsUnsubscribe();

            productsUnsubscribe = db.collection("products").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                const items = [];
                snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));

                if (isAdminMode) {
                    renderAdminTable(items);
                } else {
                    const activeItems = items.filter(item => !item.archived);
                    renderUserCatalog(activeItems.length > 0 ? activeItems : DEFAULT_DRESSES);
                }
            }, (error) => {
                console.error("Firestore error:", error);
                if (!isAdminMode) renderUserCatalog(DEFAULT_DRESSES);
            });
        }

        // --- RENDER FUNCTIONS ---
        function renderUserCatalog(products) {
            const grid = document.getElementById('userProductGrid');
            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-lg shadow overflow-hidden flex flex-col justify-between border border-gray-100">
                    <div>
                        <img src="${p.image}" alt="${p.name}" class="w-full h-64 object-cover">
                        <div class="p-4">
                            <h3 class="text-base font-bold text-gray-800 line-clamp-1">${p.name}</h3>
                            <p class="text-lg font-extrabold text-indigo-600 mt-1">₹${p.price}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <button onclick="buyOnWhatsApp('${p.name.replace(/'/g, "\\'")}', '${p.price}')" 
                            class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded font-bold text-sm transition">
                            Buy Now
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderAdminTable(products) {
            const tbody = document.getElementById('adminProductList');
            if (products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">No products in Firestore. Click "Seed 12 Sample Dresses" or add a product above.</td></tr>`;
                return;
            }
            tbody.innerHTML = products.map(p => `
                <tr class="${p.archived ? 'bg-gray-50 opacity-60' : ''}">
                    <td class="p-3"><img src="${p.image}" class="w-12 h-12 object-cover rounded"></td>
                    <td class="p-3 font-medium text-gray-800">${p.name}</td>
                    <td class="p-3 font-semibold">₹${p.price}</td>
                    <td class="p-3">
                        <span class="px-2 py-1 text-xs rounded-full font-semibold ${p.archived ? 'bg-gray-200 text-gray-700' : 'bg-green-100 text-green-700'}">
                            ${p.archived ? 'Archived' : 'Active'}
                        </span>
                    </td>
                    <td class="p-3 text-right space-x-2">
                        <button onclick="editProduct('${p.id}', '${p.name.replace(/'/g, "\\'")}', '${p.price}', '${p.image}')" class="text-blue-600 hover:underline font-medium">Edit</button>
                        <button onclick="toggleArchive('${p.id}', ${p.archived})" class="text-amber-600 hover:underline font-medium">${p.archived ? 'Unarchive' : 'Archive'}</button>
                        <button onclick="deleteProduct('${p.id}')" class="text-red-600 hover:underline font-medium">Remove</button>
                    </td>
                </tr>
            `).join('');
        }

        // --- ADMIN CRUD OPERATIONS ---
        function verifyAdmin() {
            const user = auth.currentUser;
            if (!user || !ADMIN_EMAILS.includes(user.email.toLowerCase())) {
                alert("Unauthorized action.");
                return false;
            }
            return true;
        }

        function saveProduct(e) {
            e.preventDefault();
            if (!verifyAdmin()) return;

            const id = document.getElementById('editProductId').value;
            const data = {
                name: document.getElementById('prodName').value.trim(),
                price: Number(document.getElementById('prodPrice').value),
                image: document.getElementById('prodImage').value.trim()
            };

            if (id) {
                db.collection("products").doc(id).update(data).then(resetForm);
            } else {
                data.archived = false;
                data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                db.collection("products").add(data).then(resetForm);
            }
        }

        function editProduct(id, name, price, image) {
            if (!verifyAdmin()) return;
            document.getElementById('editProductId').value = id;
            document.getElementById('prodName').value = name;
            document.getElementById('prodPrice').value = price;
            document.getElementById('prodImage').value = image;
            document.getElementById('formTitle').textContent = "Edit Dress";
            document.getElementById('submitBtn').textContent = "Update Product";
            document.getElementById('cancelEditBtn').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('editProductId').value = "";
            document.getElementById('formTitle').textContent = "Add New Dress";
            document.getElementById('submitBtn').textContent = "Upload Product";
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function toggleArchive(id, currentStatus) {
            if (!verifyAdmin()) return;
            db.collection("products").doc(id).update({ archived: !currentStatus });
        }

        function deleteProduct(id) {
